name: Notify build
description: Send the optional build result to Slack
inputs:
  title:
    required: true
  ref:
    required: true
  channel:
    required: true
  results:
    required: true
  webhook:
    required: true
    description: Slack incoming webhook URL
runs:
  using: composite
  steps:
    - name: Notify Slack
      env:
        SLACK_WEBHOOK_URL: ${{ inputs.webhook }}
        TITLE: ${{ inputs.title }}
        REF: ${{ inputs.ref }}
        CHANNEL: ${{ inputs.channel }}
        RESULTS: ${{ inputs.results }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      run: |
        message="$(jq -nr \
          --arg title "$TITLE" --arg ref "$REF" --arg channel "$CHANNEL" \
          --arg url "$RUN_URL" --argjson results "$RESULTS" '
          {success: "✅", failure: "❌", cancelled: "🚫", skipped: "⏭️"} as $icons |
          "🐍 *\($title)* — \($channel) @ \($ref)\n" +
          ($results | to_entries | map(
            "\($icons[.value.result] // "❔") \(.key) — \(.value.result)" +
            (if (.value.outputs["pr-url"] // "") != "" then
              "\n<\(.value.outputs["pr-url"])|Stage PR>" else "" end)
          ) | join("\n")) + "\n\n<\($url)|View workflow run>"
        ')"
        jq -n --arg text "$message" '{text: $text}' > "$RUNNER_TEMP/slack.json"
        curl --fail-with-body --silent --show-error \
          -H 'Content-type: application/json' \
          --data-binary "@$RUNNER_TEMP/slack.json" "$SLACK_WEBHOOK_URL"
      shell: bash

name: Resolve app source
description: Resolve an app commit and validate its package upgrade link
inputs:
  repository:
    description: Source repository
    required: true
  ref:
    description: Source branch, tag, or commit
    required: true
outputs:
  commit:
    description: Exact source commit
    value: ${{ steps.source.outputs.commit }}
runs:
  using: composite
  steps:
    - uses: actions/checkout@v4
      with:
        repository: ${{ inputs.repository }}
        ref: ${{ inputs.ref }}
        path: source
        persist-credentials: false
    - name: Resolve source
      id: source
      shell: bash
      run: |
        commit=$(git -C source rev-parse HEAD)
        link=$(jq -r '.upgrade // empty' source/package.json)
        if [[ -z "$link" ]]; then
          echo '::error::Set the upgrade field in package.json.'
          exit 1
        fi
        if [[ "$link" =~ [[:space:]] ]]; then
          echo '::error::Upgrade key must not contain whitespace.'
          exit 1
        fi
        echo "commit=$commit" >> "$GITHUB_OUTPUT"

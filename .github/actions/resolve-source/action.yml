name: Resolve app source
description: Resolve an app commit and check for upgrade key
inputs:
  repository:
    description: Source repository
    required: true
  ref:
    description: Source branch, tag, or commit
    required: true
  upgrade-key:
    description: Optional upgrade link override
    default: ''
outputs:
  commit:
    description: Exact source commit
    value: ${{ steps.source.outputs.commit }}
  upgrade-link:
    description: Upgrade link
    value: ${{ steps.source.outputs.upgrade-link }}
runs:
  using: composite
  steps:
    - uses: actions/checkout@v4
      with:
        repository: ${{ inputs.repository }}
        ref: ${{ inputs.ref }}
        path: source
        persist-credentials: false
    - name: Resolve source
      id: source
      shell: bash
      env:
        UPGRADE_KEY: ${{ inputs.upgrade-key }}
      run: |
        commit=$(git -C source rev-parse HEAD)
        link="${UPGRADE_KEY:-$(jq -r '.upgrade // empty' source/package.json)}"
        if [[ -z "${link//[[:space:]]/}" ]]; then
          echo '::error::Set upgrade key in package.json or provide upgrade-key.'
          exit 1
        fi
        echo "commit=$commit" >> "$GITHUB_OUTPUT"
        echo "upgrade-link=$link" >> "$GITHUB_OUTPUT"

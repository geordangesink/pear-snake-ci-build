name: Delete unsigned artifact
description: Remove an intermediate build artifact from the current workflow run
inputs:
  name:
    description: Exact unsigned artifact name
    required: true
runs:
  using: composite
  steps:
    - uses: holepunchto/actions/github-script@v1
      env:
        ARTIFACT_NAME: ${{ inputs.name }}
      with:
        script: |
          const name = process.env.ARTIFACT_NAME
          if (!name.startsWith('unsigned-')) throw new Error('Expected an unsigned artifact name')
          const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, {
            ...context.repo,
            run_id: context.runId,
            name
          })
          for (const artifact of artifacts) {
            if (artifact.name !== name) continue
            await github.rest.actions.deleteArtifact({
              ...context.repo,
              artifact_id: artifact.id
            })
            core.info(`Deleted ${name}`)
          }

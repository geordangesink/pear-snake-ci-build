name: Set up mobile build
description: Prepare app identity, dependencies, Bare bundle, and native project

inputs:
  platform:
    description: Native platform to generate
    required: true

runs:
  using: composite
  steps:
    - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
      with:
        node-version: 24
        cache: npm

    - name: Prepare build metadata
      shell: bash
      env:
        BUILD_PLATFORM: ${{ inputs.platform }}
      run: node scripts/prepare-build.js

    - name: Install dependencies
      shell: bash
      run: npm ci

    - name: Bundle Bare worker
      shell: bash
      run: npm run bundle:bare

    - name: Generate native project
      shell: bash
      env:
        BUILD_PLATFORM: ${{ inputs.platform }}
      run: npx expo prebuild --platform "$BUILD_PLATFORM" --no-install

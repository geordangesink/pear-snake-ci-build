name: Set up mobile build
description: Prepare app identity, dependencies, Bare bundle, and native project
inputs:
  platform:
    description: Native platform to generate
    required: true
  upgrade-key:
    description: Optional package upgrade link override
    required: false
    default: ''
runs:
  using: composite
  steps:
    - name: Validate and set upgrade link
      shell: bash
      env:
        UPGRADE_KEY: ${{ inputs.upgrade-key }}
      run: node "$GITHUB_ACTION_PATH/../resolve-source/upgrade-link.js" package.json --write
    - name: Install dependencies
      uses: holepunchto/actions/node-base-extended@v1
      with:
        version: 24
        clean-install: true
        node-auth-token: ${{ github.token }}
    - name: Prepare build metadata
      shell: bash
      env:
        BUILD_PLATFORM: ${{ inputs.platform }}
      run: node scripts/prepare-build.js
    - name: Bundle Bare worker
      shell: bash
      run: sfw npm run bundle:bare
    - name: Generate native project
      shell: bash
      env:
        BUILD_PLATFORM: ${{ inputs.platform }}
      run: sfw npx --no-install expo prebuild --platform "$BUILD_PLATFORM" --no-install

name: Set up mobile build
description: Prepare app identity, dependencies, Bare bundle, and native project
inputs:
  platform:
    description: Native platform to generate
    required: true
  upgrade-key:
    description: Optional package upgrade link override
    required: false
    default: ''
runs:
  using: composite
  steps:
    - name: Install dependencies
      uses: holepunchto/actions/node-base-extended@v1
      with:
        version: 24
        clean-install: true
    - name: Set upgrade link
      if: ${{ inputs.upgrade-key != '' }}
      shell: bash
      env:
        UPGRADE_KEY: ${{ inputs.upgrade-key }}
      run: npm pkg set "upgrade=$UPGRADE_KEY"
    - name: Prepare build metadata
      shell: bash
      env:
        BUILD_PLATFORM: ${{ inputs.platform }}
        ACTION_PATH: ${{ github.action_path }}
      run: node "$ACTION_PATH/../../../scripts/mobile/prepare-build.js"
    - name: Bundle Bare worker
      uses: holepunchto/actions/run-npm-script@v1
      with:
        script: bundle:bare
    - name: Generate native project
      shell: bash
      env:
        BUILD_PLATFORM: ${{ inputs.platform }}
      run: sfw npm run prebuild -- --platform "$BUILD_PLATFORM" --no-install

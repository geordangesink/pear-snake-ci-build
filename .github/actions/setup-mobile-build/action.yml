name: Set up mobile build
description: Prepare app identity, dependencies, Bare bundle, and native project
inputs:
  platform:
    description: Native platform to generate
    required: true
  upgrade-key:
    description: Optional package upgrade link override
    required: false
    default: ''
runs:
  using: composite
  steps:
    - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
      with:
        node-version: 24
        cache: npm
    - name: Prepare build metadata
      shell: bash
      env:
        BUILD_PLATFORM: ${{ inputs.platform }}
        BUILD_NUMBER_OFFSET: ${{ vars.BUILD_NUMBER_OFFSET || '0' }}
        IOS_BUNDLE_ID: ${{ vars.IOS_BUNDLE_ID }}
        ANDROID_PACKAGE: ${{ vars.ANDROID_PACKAGE }}
      run: |
        node scripts/prepare-build.js
        printf 'IOS_BUNDLE_ID=%s\nANDROID_PACKAGE=%s\n' "$IOS_BUNDLE_ID" "$ANDROID_PACKAGE" >> "$GITHUB_ENV"
    - name: Set upgrade link
      if: ${{ inputs.upgrade-key != '' }}
      shell: bash
      env:
        UPGRADE_KEY: ${{ inputs.upgrade-key }}
      run: |
        node <<'NODE'
        const fs = require('node:fs')
        const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'))
        pkg.upgrade = process.env.UPGRADE_KEY
        fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n')
        NODE
    - name: Install dependencies
      shell: bash
      run: npm ci
    - name: Bundle Bare worker
      shell: bash
      run: npm run bundle:bare
    - name: Generate native project
      shell: bash
      env:
        BUILD_PLATFORM: ${{ inputs.platform }}
      run: npx expo prebuild --platform "$BUILD_PLATFORM" --no-install

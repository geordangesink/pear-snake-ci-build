name: Build Snake Mobile
run-name: Snake mobile / ${{ inputs.mode }} / ${{ inputs.ref }}
on:
  workflow_dispatch:
    inputs:
      ref:
        description: snake-mobile branch, tag, or commit
        required: true
        default: main
        type: string
      mode:
        description: Build native apps, build Pear updates, or build and publish
        type: choice
        default: native
        options:
          - native
          - updates
          - publish
      build_ios:
        description: Build or publish iOS
        required: true
        default: true
        type: boolean
      build_android:
        description: Build or publish Android
        required: true
        default: true
        type: boolean
      channel:
        type: choice
        default: dev
        options:
          - dev
          - stage
          - production
      upgrade-key:
        description: Optional package.json upgrade override
        type: string
      run-stage:
        type: boolean
        default: false
        description: Build and stage Pear updates
      stage-dry-run:
        type: boolean
        default: false
      publish:
        description: Upload successful builds to TestFlight / Google Play internal testing
        required: true
        default: false
        type: boolean
      build_run_id:
        description: Optional previous native build run ID for publish mode; blank builds fresh
        type: string
        default: ''
permissions:
  contents: read
  actions: read
concurrency:
  group: mobile-build-${{ github.ref }}
  cancel-in-progress: false
defaults:
  run:
    shell: bash
env:
  CI: 'true'
  SOURCE_REPOSITORY: holepunchto/snake-mobile
  SOURCE_REF: ${{ inputs.ref }}
jobs:
  source:
    name: Resolve source
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      commit: ${{ steps.source.outputs.commit }}
      upgrade-link: ${{ steps.source.outputs.upgrade-link }}
      platforms: ${{ steps.platforms.outputs.platforms }}
    steps:
      - name: Validate build options
        env:
          MODE: ${{ inputs.mode }}
          PUBLISH: ${{ inputs.publish }}
          RUN_STAGE: ${{ inputs.run-stage }}
          IOS: ${{ inputs.build_ios }}
          ANDROID: ${{ inputs.build_android }}
          BUILD_RUN_ID: ${{ inputs.build_run_id }}
        run: |
          if [[ "$MODE" != updates && "$IOS" != true && "$ANDROID" != true ]]; then
            echo "::error::Select at least one native platform."
            exit 1
          fi
          if [[ "$MODE" == publish && -n "$BUILD_RUN_ID" ]]; then
            [[ "$BUILD_RUN_ID" =~ ^[1-9][0-9]*$ ]] || { echo "::error::build_run_id must be a numeric GitHub run ID when provided."; exit 1; }
            [[ "$RUN_STAGE" != true ]] || { echo "::error::Publishing an existing build cannot stage new updates."; exit 1; }
          elif [[ "$PUBLISH" == true && "$MODE" != native && "$MODE" != publish ]]; then
            echo "::error::Publishing requires native or publish mode."
            exit 1
          fi
      - name: Select platforms
        id: platforms
        env:
          IOS: ${{ inputs.build_ios }}
          ANDROID: ${{ inputs.build_android }}
        run: |
          platforms=$(jq -cn '[
            {platform: "ios", runner: "macos-26", enabled: env.IOS},
            {platform: "android", runner: "ubuntu-24.04", enabled: env.ANDROID}
          ] | map(select(.enabled == "true") | del(.enabled))')
          echo "platforms=$platforms" >> "$GITHUB_OUTPUT"
      - name: Checkout CI repository
        if: ${{ inputs.mode != 'publish' || inputs.build_run_id == '' }}
        uses: holepunchto/actions/checkout@v1
      - name: Resolve snake-mobile source
        id: source
        if: ${{ inputs.mode != 'publish' || inputs.build_run_id == '' }}
        uses: ./.github/actions/resolve-source
        with:
          repository: holepunchto/snake-mobile
          ref: ${{ inputs.ref }}
          upgrade-key: ${{ inputs.upgrade-key }}
  build:
    name: Build ${{ matrix.platform }}
    needs: source
    if: ${{ inputs.mode == 'native' || (inputs.mode == 'publish' && inputs.build_run_id == '') }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.source.outputs.platforms) }}
    runs-on: ${{ matrix.runner }}
    environment: release
    timeout-minutes: 90
    env:
      SOURCE_COMMIT: ${{ needs.source.outputs.commit }}
      DEVELOPER_DIR: ${{ matrix.platform == 'ios' && '/Applications/Xcode_26.2.app/Contents/Developer' || '' }}
      APPLE_TEAM_ID: ${{ matrix.platform == 'ios' && secrets.APPLE_TEAM_ID || '' }}
      IOS_CERTIFICATE_BASE64: ${{ matrix.platform == 'ios' && secrets.IOS_CERTIFICATE_BASE64 || '' }}
      IOS_P12_PASSWORD: ${{ matrix.platform == 'ios' && secrets.IOS_P12_PASSWORD || '' }}
      IOS_PROVISIONING_PROFILE_BASE64: ${{ matrix.platform == 'ios' && secrets.IOS_PROVISIONING_PROFILE_BASE64 || '' }}
      ANDROID_KEYSTORE_BASE64: ${{ matrix.platform == 'android' && secrets.ANDROID_KEYSTORE_BASE64 || '' }}
      ANDROID_KEYSTORE_PASSWORD: ${{ matrix.platform == 'android' && secrets.ANDROID_KEYSTORE_PASSWORD || '' }}
      ANDROID_KEY_ALIAS: ${{ matrix.platform == 'android' && secrets.ANDROID_KEY_ALIAS || '' }}
      ANDROID_KEY_PASSWORD: ${{ matrix.platform == 'android' && secrets.ANDROID_KEY_PASSWORD || '' }}
    steps:
      - name: Checkout snake-mobile
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          repository: holepunchto/snake-mobile
          ref: ${{ needs.source.outputs.commit }}
          token: ${{ github.token }}
          persist-credentials: false
      - name: Checkout build configuration
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.sha }}
          path: ci
          persist-credentials: false
      - uses: holepunchto/actions/setup-java@v1
        with:
          version: 17
        if: ${{ matrix.platform == 'android' }}
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: platform-tools cmake;3.22.1
        if: ${{ matrix.platform == 'android' }}
      - uses: ./ci/.github/actions/setup-mobile-build
        with:
          platform: ${{ matrix.platform }}
          upgrade-key: ${{ needs.source.outputs.upgrade-link }}
      - name: Install Pods
        working-directory: ios
        run: pod install
        if: ${{ matrix.platform == 'ios' }}
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d
        if: ${{ matrix.platform == 'android' }}
      - name: Build signed app
        env:
          BUILD_PLATFORM: ${{ matrix.platform }}
        run: bash "scripts/build-$BUILD_PLATFORM.sh"
      - name: Upload native build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mobile-${{ matrix.platform }}
          overwrite: true
          path: |
            dist/${{ matrix.platform }}/*.ipa
            dist/${{ matrix.platform }}/*.apk
            dist/${{ matrix.platform }}/*.aab
            dist/${{ matrix.platform }}/build-metadata.json
          if-no-files-found: error
          retention-days: 14
      - name: Upload build logs
        if: ${{ failure() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mobile-${{ matrix.platform }}-logs
          overwrite: true
          path: dist/${{ matrix.platform }}/*.log
          retention-days: 14
  updates:
    needs: source
    if: ${{ inputs.mode == 'updates' || ((inputs.mode == 'native' || (inputs.mode == 'publish' && inputs.build_run_id == '')) && inputs.run-stage) }}
    runs-on: ubuntu-latest
    environment: release
    timeout-minutes: 30
    steps:
      - name: Checkout snake-mobile
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          repository: holepunchto/snake-mobile
          ref: ${{ needs.source.outputs.commit }}
          token: ${{ github.token }}
          persist-credentials: false
      - name: Checkout build configuration
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.sha }}
          path: ci
          persist-credentials: false
      - name: Set upgrade link
        env:
          UPGRADE_KEY: ${{ needs.source.outputs.upgrade-link }}
        run: node ci/.github/actions/resolve-source/upgrade-link.js package.json --write
      - name: Install dependencies
        uses: holepunchto/actions/node-base-extended@v1
        with:
          version: 24
          clean-install: true
          node-auth-token: ${{ github.token }}
      - name: Record source
        env:
          SOURCE_COMMIT: ${{ needs.source.outputs.commit }}
          CHANNEL: ${{ inputs.channel }}
        run: |
          jq '{
            repository: env.SOURCE_REPOSITORY,
            ref: env.SOURCE_REF,
            sha: env.SOURCE_COMMIT,
            version,
            upgrade,
            channel: env.CHANNEL,
            buildRepository: env.GITHUB_REPOSITORY,
            buildRunId: env.GITHUB_RUN_ID
          }' package.json > "$RUNNER_TEMP/source.json"
      - name: Build mobile updates
        env:
          CI: 'true'
          npm_config_ignore_scripts: 'true'
        run: sfw npm run update
      - name: Package stage artifact
        run: tar -czf "$RUNNER_TEMP/stage.tar.gz" -C dist .
      - name: Upload stage artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: snake-mobile-stage
          path: |
            ${{ runner.temp }}/stage.tar.gz
            ${{ runner.temp }}/source.json
          if-no-files-found: error
  stage:
    needs:
      - source
      - updates
      - build
    if: ${{ always() && !cancelled() && inputs.run-stage && needs.updates.result == 'success' && (inputs.mode == 'updates' || needs.build.result == 'success') }}
    permissions:
      contents: write
      pull-requests: write
      actions: read
    runs-on: macos-latest
    environment: release
    timeout-minutes: 20
    concurrency:
      group: pear-ci-snapshot
      cancel-in-progress: false
    steps:
      - name: Checkout CI repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: holepunchto/actions/setup-node@v1
        with:
          version: 24
      - uses: holepunchto/actions/setup-socket@v1
      - name: Download mobile updates
        uses: actions/download-artifact@v4
        with:
          name: snake-mobile-stage
          path: out/artifacts
      - name: Extract mobile updates
        run: |
          mkdir -p out/stage
          tar -xzf out/artifacts/stage.tar.gz -C out/stage
      - name: Stage with pear-ci
        uses: ./.github/actions/stage
        with:
          namespace: ${{ vars.PEAR_MOBILE_NAMESPACE || format('snake-mobile-{0}-v1', inputs.channel) }}
          primary-key: ${{ secrets.PEAR_MOBILE_PRIMARY_KEY }}
          snapshot-path: ci/snake-mobile-snapshot.json
          target: ./out/stage
          upgrade-link: ${{ needs.source.outputs.upgrade-link }}
          dry-run: ${{ inputs.stage-dry-run }}
  submit:
    name: Publish ${{ matrix.platform }}
    needs:
      - source
      - build
    if: |-
      ${{ always() && !cancelled() && needs.source.result == 'success'
        && ((inputs.mode == 'publish' && inputs.build_run_id != '')
          || ((inputs.mode == 'publish' || (inputs.mode == 'native' && inputs.publish))
            && needs.build.result == 'success')) }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.source.outputs.platforms) }}
    runs-on: ${{ matrix.runner }}
    environment: release
    timeout-minutes: 30
    concurrency:
      group: snake-mobile-publish-${{ matrix.platform }}
      cancel-in-progress: false
    env:
      BUILD_RUN_ID: ${{ inputs.mode == 'publish' && inputs.build_run_id || format('{0}', github.run_id) }}
      DEVELOPER_DIR: ${{ matrix.platform == 'ios' && '/Applications/Xcode_26.2.app/Contents/Developer' || '' }}
    steps:
      - name: Download native build
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: mobile-${{ matrix.platform }}
          path: ${{ runner.temp }}/${{ matrix.platform }}
          github-token: ${{ github.token }}
          run-id: ${{ env.BUILD_RUN_ID }}
      - name: Validate and upload to App Store Connect
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_PRIVATE_KEY_BASE64: ${{ secrets.APPLE_API_PRIVATE_KEY_BASE64 }}
        run: |
          set -euo pipefail
          for key in APPLE_API_KEY_ID APPLE_API_ISSUER_ID APPLE_API_PRIVATE_KEY_BASE64; do
            if [ -z "${!key:-}" ]; then
              echo "Missing secret: $key"
              exit 1
            fi
          done
          test -s "$RUNNER_TEMP/ios/Snake.ipa"
          umask 077
          mkdir -p "$RUNNER_TEMP/appstore-connect/private_keys"
          cd "$RUNNER_TEMP/appstore-connect"
          printf '%s' "$APPLE_API_PRIVATE_KEY_BASE64" | base64 --decode > "private_keys/AuthKey_${APPLE_API_KEY_ID}.p8"
          xcrun altool --validate-app -f "$RUNNER_TEMP/ios/Snake.ipa" -t ios \
            --apiKey "$APPLE_API_KEY_ID" --apiIssuer "$APPLE_API_ISSUER_ID"
          xcrun altool --upload-app -f "$RUNNER_TEMP/ios/Snake.ipa" -t ios \
            --apiKey "$APPLE_API_KEY_ID" --apiIssuer "$APPLE_API_ISSUER_ID"
        if: ${{ matrix.platform == 'ios' }}
      - name: Remove App Store Connect private key
        if: ${{ always() && matrix.platform == 'ios' }}
        run: rm -rf "$RUNNER_TEMP/appstore-connect"
      - name: Read built application ID
        id: metadata
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          if [ -z "$GOOGLE_SERVICE_ACCOUNT_JSON" ]; then
            echo "Missing secret: GOOGLE_SERVICE_ACCOUNT_JSON"
            exit 1
          fi
          test -s "$RUNNER_TEMP/android/Snake.aab"
          package_name="$(jq -er '
            select(.platform == "android") |
            .applicationId |
            select(type == "string" and test("^[A-Za-z][A-Za-z0-9_]*(\\.[A-Za-z][A-Za-z0-9_]*)+$"))
          ' "$RUNNER_TEMP/android/build-metadata.json")"
          echo "package_name=$package_name" >> "$GITHUB_OUTPUT"
        if: ${{ matrix.platform == 'android' }}
      - name: Upload to Google Play internal testing
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          packageName: ${{ steps.metadata.outputs.package_name }}
          releaseFiles: ${{ runner.temp }}/android/Snake.aab
          tracks: internal
          status: completed
        if: ${{ matrix.platform == 'android' }}

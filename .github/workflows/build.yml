name: Build Snake Desktop
on:
  workflow_dispatch:
    inputs:
      ref:
        type: string
        default: main
      channel:
        type: choice
        default: dev
        options:
          - dev
          - stage
          - production
      run-linux-arm:
        type: boolean
        default: false
      run-linux-x64:
        type: boolean
        default: false
      run-macos:
        type: boolean
        default: false
      run-macos-intel:
        type: boolean
        default: false
      run-windows-x64:
        type: boolean
        default: false
      run-stage:
        type: boolean
        default: false
      stage-dry-run:
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  prepare:
    if: ${{ inputs.run-linux-x64 || inputs.run-linux-arm || inputs.run-macos || inputs.run-macos-intel || inputs.run-windows-x64 }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.source.outputs.commit }}
      linux: ${{ steps.matrix.outputs.linux }}
      macos: ${{ steps.matrix.outputs.macos }}
    steps:
      - uses: holepunchto/actions/checkout@v1
      - name: Resolve Snake source
        id: source
        uses: ./.github/actions/resolve-source
        with:
          repository: geordangesink/snake
          ref: ${{ inputs.ref }}
      - name: Select build platforms
        id: matrix
        env:
          LINUX_X64: ${{ inputs.run-linux-x64 }}
          LINUX_ARM64: ${{ inputs.run-linux-arm }}
          MACOS_X64: ${{ inputs.run-macos-intel }}
          MACOS_ARM64: ${{ inputs.run-macos }}
        run: |
          linux=$(jq -cn '[
            {arch: "x64", runner: "ubuntu-latest", enabled: env.LINUX_X64},
            {arch: "arm64", runner: "ubuntu-24.04-arm", enabled: env.LINUX_ARM64}
          ] | map(select(.enabled == "true") | del(.enabled))')
          macos=$(jq -cn '[
            {arch: "x64", runner: "macos-26-intel", enabled: env.MACOS_X64},
            {arch: "arm64", runner: "macos-latest", enabled: env.MACOS_ARM64}
          ] | map(select(.enabled == "true") | del(.enabled))')
          echo "linux=$linux" >> "$GITHUB_OUTPUT"
          echo "macos=$macos" >> "$GITHUB_OUTPUT"
  build-linux:
    name: Linux / ${{ matrix.arch }}
    needs: prepare
    if: ${{ inputs.run-linux-x64 || inputs.run-linux-arm }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.prepare.outputs.linux) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - name: Checkout Snake
        uses: actions/checkout@v4
        with:
          repository: geordangesink/snake
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - uses: holepunchto/actions/node-base-extended@v1
        with:
          version: 24
          clean-install: true
          allow-git: all
      - uses: holepunchto/actions/setup-bare@v1
      - name: Compile app
        uses: holepunchto/actions/make-pear-app@v1
        with:
          script: make:linux:appimage
          channel: ${{ inputs.channel }}
      - name: Set AppImage filename
        run: mv out/make/*.AppImage out/make/Snake.AppImage
      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: snake-linux-${{ matrix.arch }}-appimage
          path: out/make/Snake.AppImage
          if-no-files-found: error
  build-macos:
    name: Compile macOS / ${{ matrix.arch }}
    needs: prepare
    if: ${{ inputs.run-macos || inputs.run-macos-intel }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.prepare.outputs.macos) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - name: Checkout Snake
        uses: actions/checkout@v4
        with:
          repository: geordangesink/snake
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - uses: holepunchto/actions/node-base-extended@v1
        with:
          version: 24
          clean-install: true
          allow-git: all
      - uses: holepunchto/actions/setup-bare@v1
      - name: Compile app
        uses: holepunchto/actions/make-pear-app@v1
        with:
          script: package
          channel: ${{ inputs.channel }}
          signed: false
      - name: Package unsigned app
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            out/Snake-darwin-${{ matrix.arch }}/Snake.app "$RUNNER_TEMP/payload.zip"
      - name: Upload unsigned app
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-snake-darwin-${{ matrix.arch }}
          path: ${{ runner.temp }}/payload.zip
          if-no-files-found: error
          retention-days: 1
  sign-macos:
    name: Sign macOS / ${{ matrix.arch }}
    permissions:
      contents: read
      actions: write
    needs:
      - prepare
      - build-macos
    if: ${{ inputs.run-macos || inputs.run-macos-intel }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.prepare.outputs.macos) }}
    runs-on: ${{ matrix.runner }}
    environment: release
    timeout-minutes: 45
    steps:
      - name: Checkout CI scripts
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Install CI tools
        uses: holepunchto/actions/node-base-extended@v1
        with:
          version: 24
          clean-install: true
      - name: Download unsigned app
        uses: actions/download-artifact@v4
        with:
          name: unsigned-snake-darwin-${{ matrix.arch }}
          path: out/unsigned
      - name: Set up signing credentials
        id: certificates
        uses: holepunchto/actions/setup-certificates/macos@v1
        with:
          development_certificate_base64: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
          development_password: ${{ secrets.MACOS_P12_PASSWORD }}
          notarization_method: appstore_connect
          api_key_base64: ${{ secrets.APPLE_API_PRIVATE_KEY_BASE64 }}
          api_key_id: ${{ secrets.APPLE_API_KEY_ID }}
          api_issuer: ${{ secrets.APPLE_API_ISSUER_ID }}
      - name: Sign and notarize
        env:
          MACOS_CODESIGN_IDENTITY: ${{ secrets.MACOS_CODESIGN_IDENTITY }}
          KEYCHAIN_PROFILE: ${{ steps.certificates.outputs.keychain-profile }}
        run: bash scripts/desktop/sign-macos.sh
      - name: Remove signing credentials
        if: ${{ always() }}
        run: |
          security delete-keychain "$RUNNER_TEMP/app-signing.keychain-db" >/dev/null 2>&1 || true
          rm -f "$RUNNER_TEMP/development_certificate.p12" "$RUNNER_TEMP/AuthKey.p8"
      - name: Upload signed app
        uses: actions/upload-artifact@v4
        with:
          name: snake-darwin-${{ matrix.arch }}-app.zip
          path: out/signed/Snake-app.zip
          if-no-files-found: error
      - name: Upload signed DMG
        uses: actions/upload-artifact@v4
        with:
          name: snake-darwin-${{ matrix.arch }}-dmg
          path: out/signed/Snake.dmg
          if-no-files-found: error
      - name: Delete unsigned app
        uses: ./.github/actions/delete-unsigned-artifact
        with:
          name: unsigned-snake-darwin-${{ matrix.arch }}
  build-win32-x64:
    name: Compile Windows / x64
    needs: prepare
    if: ${{ inputs.run-windows-x64 }}
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - name: Checkout Snake
        uses: actions/checkout@v4
        with:
          repository: geordangesink/snake
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - uses: holepunchto/actions/node-base-extended@v1
        with:
          version: 24
          clean-install: true
          allow-git: all
      - uses: holepunchto/actions/setup-bare@v1
      - name: Compile app
        uses: holepunchto/actions/make-pear-app@v1
        with:
          script: make:win32
          channel: ${{ inputs.channel }}
          signed: false
      - name: Upload unsigned MSIX
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-snake-win32-x64
          path: out/make/msix/x64/Snake.msix
          if-no-files-found: error
          retention-days: 1
  sign-win32-x64:
    name: Sign Windows / x64
    permissions:
      contents: read
      actions: write
    needs: build-win32-x64
    runs-on: windows-signer
    environment: release
    timeout-minutes: 15
    steps:
      - name: Checkout CI scripts
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Install CI tools
        uses: holepunchto/actions/node-base-extended@v1
        with:
          version: 24
          clean-install: true
      - name: Download unsigned MSIX
        uses: actions/download-artifact@v4
        with:
          name: unsigned-snake-win32-x64
          path: out/unsigned
      - name: Sign and verify MSIX
        shell: pwsh
        env:
          WINDOWS_CERT_SHA1: ${{ secrets.WINDOWS_CERT_SHA1 }}
        run: ./scripts/desktop/sign-windows.ps1
      - name: Upload signed MSIX
        uses: actions/upload-artifact@v4
        with:
          name: snake-win32-x64-msix
          path: out/signed/Snake.msix
          if-no-files-found: error
      - name: Delete unsigned MSIX
        uses: ./.github/actions/delete-unsigned-artifact
        with:
          name: unsigned-snake-win32-x64
  stage:
    needs:
      - prepare
      - build-linux
      - sign-macos
      - sign-win32-x64
    if: |-
      ${{ always() && !cancelled() && inputs.run-stage
        && needs.prepare.result == 'success'
        && (!(inputs.run-linux-x64 || inputs.run-linux-arm) || needs.build-linux.result == 'success')
        && (!(inputs.run-macos || inputs.run-macos-intel) || needs.sign-macos.result == 'success')
        && (!inputs.run-windows-x64 || needs.sign-win32-x64.result == 'success') }}
    permissions:
      contents: write
      pull-requests: write
      actions: read
    runs-on: macos-latest
    environment: release
    timeout-minutes: 20
    concurrency:
      group: pear-ci-snapshot
      cancel-in-progress: false
    steps:
      - name: Checkout CI repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Checkout snake source
        uses: actions/checkout@v4
        with:
          repository: geordangesink/snake
          ref: ${{ needs.prepare.outputs.sha }}
          path: snake-source
          persist-credentials: false
      - name: Install CI tools
        uses: holepunchto/actions/node-base-extended@v1
        with:
          version: 24
          clean-install: true
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: snake-*
          path: out/artifacts
      - name: Build stage artifact
        run: |
          node scripts/build-stage-artifact.js
          tar -czf "$RUNNER_TEMP/stage.tar.gz" -C out/snake-stage .
      - name: Upload stage artifact
        uses: actions/upload-artifact@v4
        with:
          name: snake-stage
          path: ${{ runner.temp }}/stage.tar.gz
          if-no-files-found: error
      - name: Authenticate snapshot updates
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh auth setup-git
      - name: Stage with pear-ci
        uses: holepunchto/actions/pear-ci@v1
        with:
          namespace: ${{ vars.PEAR_DESKTOP_NAMESPACE || format('snake-{0}-v1', inputs.channel) }}
          primary-key: ${{ secrets.PEAR_PRIMARY_KEY }}
          target: ./out/snake-stage
          dry-run: ${{ inputs.stage-dry-run }}

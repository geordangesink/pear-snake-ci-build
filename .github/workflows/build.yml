name: Build Snake Desktop
on:
  workflow_dispatch:
    inputs:
      ref:
        type: string
        default: main
      channel:
        type: choice
        default: dev
        options:
          - dev
          - stage
          - production
      upgrade-key:
        description: Value for package.json upgrade field
        type: string
        default: ''
      run-linux-arm:
        type: boolean
        default: false
      run-linux-x64:
        type: boolean
        default: false
      run-macos:
        type: boolean
        default: false
      run-macos-intel:
        type: boolean
        default: false
      run-windows-x64:
        type: boolean
        default: false
      run-stage:
        type: boolean
        default: false
      stage-dry-run:
        type: boolean
        default: false
permissions:
  contents: read
  packages: read
env:
  CHANNEL: ${{ inputs.channel }}
jobs:
  prepare:
    if: ${{ inputs.run-linux-x64 || inputs.run-linux-arm || inputs.run-macos || inputs.run-macos-intel || inputs.run-windows-x64 }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.source.outputs.commit }}
      upgrade-link: ${{ steps.source.outputs.upgrade-link }}
      linux: ${{ steps.matrix.outputs.linux }}
      macos: ${{ steps.matrix.outputs.macos }}
    steps:
      - uses: holepunchto/actions/checkout@v1
      - name: Resolve Snake source
        id: source
        uses: ./.github/actions/resolve-source
        with:
          repository: holepunchto/snake
          ref: ${{ inputs.ref }}
          upgrade-key: ${{ inputs.upgrade-key }}
      - name: Select build platforms
        id: matrix
        env:
          LINUX_X64: ${{ inputs.run-linux-x64 }}
          LINUX_ARM64: ${{ inputs.run-linux-arm }}
          MACOS_X64: ${{ inputs.run-macos-intel }}
          MACOS_ARM64: ${{ inputs.run-macos }}
        run: |
          linux=$(jq -cn '[
            {arch: "x64", runner: "ubuntu-latest", enabled: env.LINUX_X64},
            {arch: "arm64", runner: "ubuntu-24.04-arm", enabled: env.LINUX_ARM64}
          ] | map(select(.enabled == "true") | del(.enabled))')
          macos=$(jq -cn '[
            {arch: "x64", runner: "macos-26-intel", enabled: env.MACOS_X64},
            {arch: "arm64", runner: "macos-latest", enabled: env.MACOS_ARM64}
          ] | map(select(.enabled == "true") | del(.enabled))')
          echo "linux=$linux" >> "$GITHUB_OUTPUT"
          echo "macos=$macos" >> "$GITHUB_OUTPUT"
  build-linux:
    name: Linux / ${{ matrix.arch }}
    needs: prepare
    if: ${{ inputs.run-linux-x64 || inputs.run-linux-arm }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.prepare.outputs.linux) }}
    runs-on: ${{ matrix.runner }}
    environment: release
    timeout-minutes: 30
    steps:
      - name: Checkout snake
        uses: actions/checkout@v4
        with:
          repository: holepunchto/snake
          ref: ${{ needs.prepare.outputs.sha }}
          token: ${{ github.token }}
          persist-credentials: false
      - name: Install dependencies
        uses: holepunchto/actions/node-base-extended@v1
        with:
          allow-git: all
          version: 24
          node-auth-token: ${{ github.token }}
      - name: Setup bare
        uses: holepunchto/actions/setup-bare@v1
      - name: Build AppImage
        env:
          UPGRADE_KEY: ${{ needs.prepare.outputs.upgrade-link }}
          NODE_ENV: production
          NODE_AUTH_TOKEN: ${{ github.token }}
        run: sfw npm run make -- --targets=pear-electron-forge-maker-appimage
      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: snake-linux-${{ matrix.arch }}-appimage
          path: out/make/**/*.AppImage
          if-no-files-found: error
  build-macos:
    name: macOS / ${{ matrix.arch }}
    needs: prepare
    if: ${{ inputs.run-macos || inputs.run-macos-intel }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.prepare.outputs.macos) }}
    runs-on: ${{ matrix.runner }}
    environment: release
    timeout-minutes: 60
    steps:
      - name: Validate macOS signing secrets
        shell: bash
        env:
          MACOS_CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
          MACOS_P12_PASSWORD: ${{ secrets.MACOS_P12_PASSWORD }}
          MACOS_CODESIGN_IDENTITY: ${{ secrets.MACOS_CODESIGN_IDENTITY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_PRIVATE_KEY_BASE64: ${{ secrets.APPLE_API_PRIVATE_KEY_BASE64 }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          missing=0
          for name in MACOS_CERTIFICATE_BASE64 MACOS_P12_PASSWORD MACOS_CODESIGN_IDENTITY \
            APPLE_API_KEY_ID APPLE_API_PRIVATE_KEY_BASE64 APPLE_API_ISSUER_ID; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing Actions secret $name. Configure desktop signing."
              missing=1
            fi
          done
          exit "$missing"
      - name: Checkout snake
        uses: actions/checkout@v4
        with:
          repository: holepunchto/snake
          ref: ${{ needs.prepare.outputs.sha }}
          token: ${{ github.token }}
          persist-credentials: false
      - name: Checkout macOS build tools
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: .snake-ci
          sparse-checkout: scripts/sign-macos-artifacts.sh
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Prepare macOS build tools
        run: |
          cp .snake-ci/scripts/sign-macos-artifacts.sh "$RUNNER_TEMP/sign-macos-artifacts.sh"
          rm -rf .snake-ci
      - name: Install dependencies
        uses: holepunchto/actions/node-base-extended@v1
        with:
          allow-git: all
          version: 24
          node-auth-token: ${{ github.token }}
      - name: Build native DMG dependencies
        run: sfw npm rebuild macos-alias fs-xattr --ignore-scripts=false --foreground-scripts
      - name: Setup bare
        uses: holepunchto/actions/setup-bare@v1
      - name: Build macOS app
        uses: holepunchto/actions/make-pear-app@v1
        with:
          channel: ${{ env.CHANNEL }}
          upgrade_key: ${{ needs.prepare.outputs.upgrade-link }}
          macos_certificate_base64: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
          macos_p12_password: ${{ secrets.MACOS_P12_PASSWORD }}
          macos_codesign_identity: ${{ secrets.MACOS_CODESIGN_IDENTITY }}
          macos_notarization_method: appstore_connect
          macos_api_key_base64: ${{ secrets.APPLE_API_PRIVATE_KEY_BASE64 }}
          macos_api_key_id: ${{ secrets.APPLE_API_KEY_ID }}
          macos_api_issuer: ${{ secrets.APPLE_API_ISSUER_ID }}
      - name: Sign and verify macOS artifacts
        env:
          MACOS_CODESIGN_IDENTITY: ${{ secrets.MACOS_CODESIGN_IDENTITY }}
          ARCH: ${{ matrix.arch }}
        run: bash "$RUNNER_TEMP/sign-macos-artifacts.sh" "$ARCH"
      - name: Upload signed macOS DMG
        uses: actions/upload-artifact@v4
        with:
          name: snake-darwin-${{ matrix.arch }}-dmg
          path: out/make/**/*.dmg
          if-no-files-found: error
      - name: Upload signed macOS app
        uses: actions/upload-artifact@v4
        with:
          name: snake-darwin-${{ matrix.arch }}-app.zip
          path: ${{ runner.temp }}/snake-darwin-${{ matrix.arch }}-app.zip
          if-no-files-found: error
  build-win32-x64:
    needs: prepare
    if: ${{ inputs.run-windows-x64 }}
    runs-on: windows-signer
    environment: release
    timeout-minutes: 30
    steps:
      - name: Validate Windows signing secrets
        shell: pwsh
        env:
          WINDOWS_CERT_SHA1: ${{ secrets.WINDOWS_CERT_SHA1 }}
        run: |
          if (-not $env:WINDOWS_CERT_SHA1) {
            throw 'Missing Actions secret WINDOWS_CERT_SHA1. See DESKTOP_SIGNING.md.'
          }
      - name: Checkout snake
        uses: actions/checkout@v4
        with:
          repository: holepunchto/snake
          ref: ${{ needs.prepare.outputs.sha }}
          token: ${{ github.token }}
          persist-credentials: false
      - name: Checkout Windows signing tools
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: .snake-ci
          sparse-checkout: |
            scripts/prepare-windows-signing.ps1
            scripts/verify-windows-signing.ps1
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Prepare Windows signing
        id: signing
        shell: pwsh
        env:
          WINDOWS_CERT_SHA1: ${{ secrets.WINDOWS_CERT_SHA1 }}
        run: |
          Copy-Item .snake-ci/scripts/*-windows-signing.ps1 $env:RUNNER_TEMP
          Remove-Item .snake-ci -Recurse -Force
          & "$env:RUNNER_TEMP/prepare-windows-signing.ps1"
      - name: Install dependencies
        uses: holepunchto/actions/node-base-extended@v1
        with:
          allow-git: all
          version: 24
          node-auth-token: ${{ github.token }}
      - name: Setup bare
        uses: holepunchto/actions/setup-bare@v1
      - name: Build windows x64
        uses: holepunchto/actions/make-pear-app@v1
        with:
          channel: ${{ env.CHANNEL }}
          upgrade_key: ${{ needs.prepare.outputs.upgrade-link }}
          windows_signing_method: cert_sha1
          windows_cert_sha1: ${{ steps.signing.outputs.thumbprint }}
      - name: Verify Windows package signature
        shell: pwsh
        env:
          WINDOWS_CERT_SHA1: ${{ steps.signing.outputs.thumbprint }}
        run: '& "$env:RUNNER_TEMP/verify-windows-signing.ps1"'
      - name: Upload signed Windows app
        uses: actions/upload-artifact@v4
        with:
          name: snake-win32-x64-msix
          path: out/make/**/*.msix
          if-no-files-found: error
  stage:
    needs:
      - prepare
      - build-linux
      - build-macos
      - build-win32-x64
    if: |-
      ${{ always() && !cancelled() && inputs.run-stage
        && needs.prepare.result == 'success'
        && (!(inputs.run-linux-x64 || inputs.run-linux-arm) || needs.build-linux.result == 'success')
        && (!(inputs.run-macos || inputs.run-macos-intel) || needs.build-macos.result == 'success')
        && (!inputs.run-windows-x64 || needs.build-win32-x64.result == 'success') }}
    permissions:
      contents: write
      pull-requests: write
      actions: read
    runs-on: macos-latest
    environment: release
    timeout-minutes: 20
    concurrency:
      group: pear-ci-snapshot
      cancel-in-progress: false
    steps:
      - name: Checkout CI repository
        uses: actions/checkout@v4
      - name: Checkout snake source
        uses: actions/checkout@v4
        with:
          repository: holepunchto/snake
          ref: ${{ needs.prepare.outputs.sha }}
          path: snake-source
          persist-credentials: false
      - name: Setup Node
        uses: holepunchto/actions/setup-node@v1
        with:
          version: 24
      - uses: holepunchto/actions/setup-socket@v1
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: snake-*
          path: out/artifacts
      - name: Build stage artifact
        env:
          UPGRADE_KEY: ${{ needs.prepare.outputs.upgrade-link }}
        run: |
          node scripts/build-stage-artifact.js
          tar -czf "$RUNNER_TEMP/stage.tar.gz" -C out/snake-stage .
      - name: Upload stage artifact
        uses: actions/upload-artifact@v4
        with:
          name: snake-stage
          path: ${{ runner.temp }}/stage.tar.gz
          if-no-files-found: error
      - name: Stage with pear-ci
        uses: ./.github/actions/stage
        with:
          namespace: ${{ vars.PEAR_DESKTOP_NAMESPACE || format('snake-{0}-v1', inputs.channel) }}
          primary-key: ${{ secrets.PEAR_DESKTOP_PRIMARY_KEY }}
          snapshot-path: ci/snake-snapshot.json
          target: ./out/snake-stage
          upgrade-link: ${{ needs.prepare.outputs.upgrade-link }}
          dry-run: ${{ inputs.stage-dry-run }}

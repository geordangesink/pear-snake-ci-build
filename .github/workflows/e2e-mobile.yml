name: E2E Snake Mobile
run-name: E2E Snake Mobile · ${{ inputs.ref }}

on:
  workflow_dispatch:
    inputs:
      ref:
        description: snake-mobile branch, tag, or commit
        required: true
        default: main
        type: string
      run_ios:
        description: Test iOS Simulator
        required: true
        default: true
        type: boolean
      run_android:
        description: Test Android emulator
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: e2e-mobile-${{ github.ref }}-${{ inputs.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  CI: 'true'
  MAESTRO_CLI_NO_ANALYTICS: 'true'

jobs:
  source:
    name: Resolve source
    if: ${{ inputs.run_ios || inputs.run_android }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      commit: ${{ steps.source.outputs.commit }}
      matrix: ${{ steps.source.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/snake-mobile
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Resolve commit and test platforms
        id: source
        env:
          RUN_IOS: ${{ inputs.run_ios }}
          RUN_ANDROID: ${{ inputs.run_android }}
        run: |
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          matrix=$(jq -cn '{include: [
            {platform: "ios", os: "macos-26", enabled: env.RUN_IOS},
            {platform: "android", os: "ubuntu-24.04", enabled: env.RUN_ANDROID}
          ] | map(select(.enabled == "true") | del(.enabled))}')
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  e2e:
    name: ${{ matrix.platform }}
    needs: source
    if: ${{ inputs.run_ios || inputs.run_android }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.source.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - name: Checkout tests
        uses: holepunchto/actions/checkout@v1

      - name: Checkout snake-mobile
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/snake-mobile
          ref: ${{ needs.source.outputs.commit }}
          path: source
          persist-credentials: false

      - uses: holepunchto/actions/setup-node@v1
        with:
          version: 24

      - uses: holepunchto/actions/setup-socket@v1

      - uses: holepunchto/actions/setup-java@v1
        with:
          version: 17

      - name: Select Xcode
        if: ${{ matrix.platform == 'ios' }}
        run: echo 'DEVELOPER_DIR=/Applications/Xcode_26.2.app/Contents/Developer' >> "$GITHUB_ENV"

      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        if: ${{ matrix.platform == 'android' }}
        with:
          packages: platform-tools cmake;3.22.1

      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d
        if: ${{ matrix.platform == 'android' }}

      - name: Install dependencies
        working-directory: source
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          mkdir -p "$GITHUB_WORKSPACE/e2e-results/$PLATFORM"
          sfw npm ci --ignore-scripts --foreground-scripts 2>&1 | tee "$GITHUB_WORKSPACE/e2e-results/$PLATFORM/install.log"

      - name: Install Maestro
        run: |
          bash test/e2e/mobile/install-maestro.sh
          "$RUNNER_TEMP/snake-maestro/maestro/bin/maestro" check-syntax test/e2e/mobile/smoke.yaml

      - name: Build test app
        env:
          PLATFORM: ${{ matrix.platform }}
        run: bash test/e2e/mobile/build.sh "$PLATFORM"

      - name: Test iOS
        if: ${{ matrix.platform == 'ios' }}
        run: bash test/e2e/mobile/run.sh ios

      - name: Enable emulator acceleration
        if: ${{ matrix.platform == 'android' }}
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Test Android
        if: ${{ matrix.platform == 'android' }}
        uses: reactivecircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash test/e2e/mobile/run.sh android

      - name: Upload test results
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: e2e-mobile-${{ matrix.platform }}
          overwrite: true
          path: e2e-results/${{ matrix.platform }}
          if-no-files-found: ignore
          retention-days: 14

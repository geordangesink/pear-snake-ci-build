name: E2E Snake Desktop
on:
  workflow_run:
    workflows:
      - Build Snake Desktop
    types:
      - completed
    branches:
      - main
  workflow_dispatch:
    inputs:
      run-id:
        description: Completed desktop build run ID containing app artifacts
        type: string
        required: true
permissions:
  actions: read
  contents: read
defaults:
  run:
    shell: bash
jobs:
  prepare:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.artifacts.outputs.matrix }}
      run-id: ${{ steps.artifacts.outputs.run-id }}
    steps:
      - uses: holepunchto/actions/checkout@v1
      - name: Select packaged app artifacts
        id: artifacts
        uses: ./.github/actions/desktop-artifacts
        with:
          run-id: ${{ github.event.workflow_run.id || inputs.run-id }}
  e2e:
    needs: prepare
    name: App smoke / ${{ matrix.artifact }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - name: Checkout E2E suite
        uses: holepunchto/actions/checkout@v1
      - uses: holepunchto/actions/setup-node@v1
        with:
          version: 24
      - uses: holepunchto/actions/setup-socket@v1
      - name: Install E2E dependencies
        working-directory: test/e2e/desktop
        run: sfw npm ci --ignore-scripts
      - name: Install Linux GUI dependencies
        if: ${{ runner.os == 'Linux' }}
        working-directory: test/e2e/desktop
        run: sfw npx --no-install playwright install-deps chromium
      - name: Download packaged app
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ needs.prepare.outputs.run-id }}
          name: ${{ matrix.artifact }}
          path: artifact
      - name: Extract app for smoke test
        id: app
        run: node scripts/find-snake-artifact.js artifact
      - name: Exercise native IPC and multiplayer
        working-directory: test/e2e/desktop
        env:
          SNAKE_E2E_BIN: ${{ steps.app.outputs.path }}
          SNAKE_E2E_APPIMAGE: ${{ steps.app.outputs.appimage }}
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            xvfb-run -a npm test
          else
            npm test
          fi
      - name: Upload app smoke results
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: e2e-${{ matrix.artifact }}
          path: test/e2e/desktop/results
          if-no-files-found: warn
          retention-days: 14

name: Build Mobile Store Releases

on:
  workflow_dispatch:
    inputs:
      profile:
        description: Distribution profile
        required: true
        default: production
        type: choice
        options:
          - production
          - preview
      build_ios:
        description: Build iOS
        required: true
        default: true
        type: boolean
      build_android:
        description: Build Android
        required: true
        default: true
        type: boolean
      build_number:
        description: Optional build number (defaults to run number + BUILD_NUMBER_OFFSET)
        required: false
        type: string
      publish:
        description: Publish successful production builds to TestFlight / Google Play internal testing
        required: true
        default: true
        type: boolean

permissions:
  contents: read
  actions: read

concurrency:
  group: mobile-build-store-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  CI: 'true'
  BUILD_PROFILE: ${{ inputs.profile }}
  BUILD_NUMBER: ${{ inputs.build_number }}
  BUILD_NUMBER_OFFSET: ${{ vars.BUILD_NUMBER_OFFSET || '0' }}
  IOS_BUNDLE_ID: ${{ vars.IOS_BUNDLE_ID }}
  ANDROID_PACKAGE: ${{ vars.ANDROID_PACKAGE }}

jobs:
  build-ios:
    name: Build iOS
    if: ${{ inputs.build_ios }}
    runs-on: macos-26
    timeout-minutes: 90
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
      P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
      IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets[inputs.profile == 'production' && 'IOS_PROVISIONING_PROFILE_BASE64' || 'IOS_ADHOC_PROVISIONING_PROFILE_BASE64'] }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - uses: ./.github/actions/setup-build
        with:
          platform: ios

      - name: Install Pods
        working-directory: ios
        run: pod install

      - name: Archive and export signed IPA
        run: bash scripts/build-ios.sh

      - name: Upload iOS build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mobile-ios-${{ inputs.profile }}
          overwrite: true
          path: |
            dist/ios/Snake.ipa
            dist/ios/build-metadata.json
          if-no-files-found: error
          retention-days: 14

      - name: Upload iOS build logs
        if: ${{ failure() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mobile-ios-logs
          overwrite: true
          path: dist/ios/*.log
          retention-days: 14

  build-android:
    name: Build Android
    if: ${{ inputs.build_android }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: platform-tools cmake;3.22.1

      - uses: ./.github/actions/setup-build
        with:
          platform: android

      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d

      - name: Build signed Android artifacts
        run: bash scripts/build-android.sh

      - name: Upload Android build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mobile-android-${{ inputs.profile }}
          overwrite: true
          path: |
            dist/android/Snake.apk
            dist/android/*.aab
            dist/android/build-metadata.json
          if-no-files-found: error
          retention-days: 14

      - name: Upload Android build logs
        if: ${{ failure() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mobile-android-logs
          overwrite: true
          path: dist/android/*.log
          retention-days: 14

  publish:
    name: Publish
    needs: [build-ios, build-android]
    if: >-
      ${{ !cancelled() && inputs.publish && inputs.profile == 'production' &&
          needs.build-ios.result != 'failure' && needs.build-android.result != 'failure' &&
          (needs.build-ios.result == 'success' || needs.build-android.result == 'success') }}
    uses: ./.github/workflows/publish-store.yml
    secrets: inherit
    with:
      build_run_id: ${{ format('{0}', github.run_id) }}
      submit_ios: ${{ needs.build-ios.result == 'success' }}
      submit_android: ${{ needs.build-android.result == 'success' }}

  build-summary:
    name: Build Summary
    if: ${{ always() }}
    needs: [build-ios, build-android]
    runs-on: ubuntu-24.04
    env:
      IOS_RESULT: ${{ needs.build-ios.result }}
      ANDROID_RESULT: ${{ needs.build-android.result }}
      PUBLISH_REQUESTED: ${{ inputs.publish }}
    steps:
      - name: Summarize build artifacts
        run: |
          {
            echo "## Mobile builds"
            echo "- iOS: $IOS_RESULT"
            echo "- Android: $ANDROID_RESULT"
            echo "- Profile: $BUILD_PROFILE"
            echo "- Build run ID: $GITHUB_RUN_ID"
            echo "- Publish requested: $PUBLISH_REQUESTED"
            echo "Download the signed binaries and build metadata from this run's artifacts."
          } >> "$GITHUB_STEP_SUMMARY"
